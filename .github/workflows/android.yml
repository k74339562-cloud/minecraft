name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # تثبيت ج Gradle تلقائياً للاستغناء عن ملف gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # البناء مباشرة باستخدام أمر gradle
      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftClone-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
