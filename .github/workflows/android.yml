name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # إيقاف كاش Gradle لحذف التحذيرات المزعجة
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # تحميل مكتبة GLM تلقائياً في ثوانٍ
      - name: Download GLM Library
        run: |
          if [ ! -d "lib/glm" ]; then
            git clone --depth 1 https://github.com/g-truc/glm.git lib/glm
          fi

      # تشغيل البناء مع إظهار الخطأ المباشر فقط بدون أي تشويش
      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --console=plain

      # رفع ملف الـ APK النهائي
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftClone-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
