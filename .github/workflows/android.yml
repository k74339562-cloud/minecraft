name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # إيقاف كاش Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # تحميل مكتبة GLM
      - name: Download GLM Library
        run: |
          if [ ! -d "lib/glm" ]; then
            git clone --depth 1 https://github.com/g-truc/glm.git lib/glm
          fi

      # فحص ملفات المشروع في السيرفر
      - name: Inspect Files
        run: |
          echo "=== FILES IN SRC ==="
          ls -R src/ || true

      # تشغيل البناء مع صيد الخطأ وطباعة آخر 80 سطراً فوراً إذا حدث أي خطأ
      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "====================== REAL ERROR DETAILS ======================"
            tail -n 80 build.log
            exit 1
          }

      # رفع ملف الـ APK
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftClone-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
