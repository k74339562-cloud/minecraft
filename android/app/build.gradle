plugins {
    id 'com.android.application'
}

android {
    namespace 'com.engine.minecraftclone'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.engine.minecraftclone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // تحديد معمارية الهواتف الحديثة فقط لتسريع البناء بنسبة 400%
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug {
            // أندرويد يتولى التوقيع التلقائي الذاتي هنا بدون أي أخطاء
            debuggable true
        }
        release {
            // استخدام نفس التوقيع التلقائي لنسخة Release
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            // ربط مجلد الموارد (الصور والشيدرات)
            assets.srcDirs = ['../../res']
        }
    }
}
